<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Go/No-Go 認知機能ゲーム</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0fdf4;
            touch-action: manipulation;
            user-select: none;
            overflow: hidden; /* スクロール防止 */
        }
        
        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            80% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .target-anim {
            animation: popIn 0.2s ease-out forwards;
        }

        @keyframes feedbackPop {
            0% { transform: scale(0.5); opacity: 0; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1); opacity: 0; }
        }
        .feedback-anim {
            animation: feedbackPop 0.6s ease-in-out forwards;
        }

        .game-target {
            position: absolute;
            font-size: 7rem; /* やや大きめ約112px */
            cursor: pointer;
            line-height: 1;
            filter: drop-shadow(0 10px 8px rgb(0 0 0 / 0.2));
            transition: transform 0.1s;
            /* アイコンの中心が配置座標になるように調整 */
            transform: translate(-50%, -50%); 
        }
        .game-target:active {
            transform: translate(-50%, -50%) scale(0.9);
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col items-center justify-center text-gray-800">

    <audio id="bgm" src="bgm.mp3" loop></audio>

    <!-- スタート画面 -->
    <div id="start-screen" class="flex flex-col items-center justify-center w-full h-full p-4 text-center">
        <h1 class="text-5xl md:text-6xl font-black text-green-700 mb-6 tracking-wider leading-tight">
            脳トレ・クリック！<br>
            <span class="text-4xl text-orange-600">〜注意力を鍛えよう〜</span>
        </h1>
        
        <div class="bg-white p-6 md:p-8 rounded-3xl shadow-2xl border-4 border-green-500 mb-8 max-w-4xl">
            <h2 class="text-3xl font-bold mb-4 text-gray-800 border-b-4 border-green-200 pb-2">【あそびかた】</h2>
            <ul class="text-2xl md:text-3xl font-bold space-y-4 text-left">
                <li class="flex items-center">
                    <span class="text-5xl mr-4">🍎</span> 
                    <div>
                        <span class="text-red-600">赤りんご</span> が出たら <span class="text-red-600 border-b-4 border-red-600">それだけをクリック！</span>
                    </div>
                </li>
                <li class="flex items-start mt-6">
                    <span class="text-5xl mr-4 whitespace-nowrap">🍅🍑🍏💣</span> 
                    <div>
                        ニセモノだけの時は <span class="text-blue-600 border-b-4 border-blue-600">何もさわらずに待つ！</span><br>
                        <span class="text-xl text-gray-500 font-normal">（トマトや桃にだまされないで！）</span>
                    </div>
                </li>
            </ul>
        </div>

        <button id="start-btn" class="bg-red-500 hover:bg-red-600 text-white font-black text-4xl md:text-5xl py-6 px-16 rounded-full shadow-[0_10px_0_rgb(185,28,28)] active:shadow-[0_0px_0_rgb(185,28,28)] active:translate-y-[10px] transition-all">
            ゲームスタート！
        </button>
    </div>

    <!-- ゲーム画面 -->
    <div id="game-screen" class="hidden flex-col w-full h-full relative">
        <div class="h-24 bg-green-700 text-white flex justify-between items-center px-8 shadow-md z-10 shrink-0">
            <div class="text-3xl md:text-4xl font-bold">
                回数：<span id="round-display" class="text-yellow-300">1 / 20</span>
            </div>
            <div class="text-3xl md:text-4xl font-bold">
                得点：<span id="score-display" class="text-yellow-300">0</span> 点
            </div>
        </div>

        <div id="play-area" class="flex-1 relative bg-white overflow-hidden cursor-crosshair w-full h-full">
            <!-- ターゲット要素はJSで生成 -->
        </div>

        <div id="feedback-overlay" class="absolute inset-0 flex items-center justify-center pointer-events-none z-50 hidden">
            <span id="feedback-text" class="text-[15rem] md:text-[20rem] font-black filter drop-shadow-2xl">⭕️</span>
        </div>
    </div>

    <!-- 結果画面 -->
    <div id="result-screen" class="hidden flex-col items-center justify-center w-full h-full p-4 text-center bg-yellow-50">
        <h2 class="text-5xl md:text-6xl font-bold text-gray-700 mb-4">結果発表</h2>
        
        <div class="bg-white p-12 rounded-3xl shadow-2xl border-8 border-yellow-400 mb-10">
            <p class="text-3xl font-bold text-gray-500 mb-2">あなたの得点は...</p>
            <div class="text-[6rem] md:text-[9rem] font-black text-red-600 leading-none">
                <span id="final-score">100</span><span class="text-5xl md:text-7xl text-gray-700">点</span>
            </div>
            <p id="result-message" class="text-3xl md:text-4xl font-bold text-green-700 mt-6">
                素晴らしい集中力です！
            </p>
        </div>

        <button id="restart-btn" class="bg-blue-500 hover:bg-blue-600 text-white font-black text-4xl py-6 px-12 rounded-full shadow-[0_10px_0_rgb(29,78,216)] active:shadow-[0_0px_0_rgb(29,78,216)] active:translate-y-[10px] transition-all">
            もう一度あそぶ
        </button>
    </div>

    <script>
        // --- 設定値 ---
        const TOTAL_ROUNDS = 20;
        const TARGET_DURATION = 2000; // 2.0秒（難易度が上がったため少し長めに設定）
        const POINTS_PER_ROUND = 5;
        const DISTRACTORS = ['🍅', '🍑', '🍏', '💣'];

        let currentRound = 0;
        let score = 0;
        let isPlaying = false;
        let roundTimeout;
        let hasTargetInCurrentRound = false;

        // --- DOM要素 ---
        const screens = {
            start: document.getElementById('start-screen'),
            game: document.getElementById('game-screen'),
            result: document.getElementById('result-screen')
        };
        const playArea = document.getElementById('play-area');
        const roundDisplay = document.getElementById('round-display');
        const scoreDisplay = document.getElementById('score-display');
        const feedbackOverlay = document.getElementById('feedback-overlay');
        const feedbackText = document.getElementById('feedback-text');
        const finalScore = document.getElementById('final-score');
        const resultMessage = document.getElementById('result-message');
        const bgm = document.getElementById('bgm');

        function showScreen(screenName) {
            Object.values(screens).forEach(screen => screen.classList.add('hidden'));
            screens[screenName].classList.remove('hidden');
            if(screenName === 'game') screens[screenName].classList.add('flex');
            if(screenName === 'start' || screenName === 'result') screens[screenName].classList.add('flex');
        }

        function playBGM() {
            bgm.currentTime = 0;
            bgm.play().catch(e => console.log("BGM自動再生ブロック:", e));
        }
        function stopBGM() {
            bgm.pause();
        }

        function startGame() {
            currentRound = 0;
            score = 0;
            isPlaying = true;
            updateHeader();
            showScreen('game');
            playBGM();
            setTimeout(nextRound, 1000);
        }

        // ランダムなダミーを取得
        function getRandomDistractor() {
            return DISTRACTORS[Math.floor(Math.random() * DISTRACTORS.length)];
        }

        // --- ラウンド制御ロジック ---
        function nextRound() {
            if (currentRound >= TOTAL_ROUNDS) {
                endGame();
                return;
            }

            currentRound++;
            updateHeader();
            playArea.innerHTML = ''; 

            // 1. 今回のアイテム数（2個 or 3個）と、正解（赤リンゴ）が含まれるかを決定
            const numItems = Math.random() < 0.5 ? 2 : 3;
            hasTargetInCurrentRound = Math.random() < 0.5; // 50%で赤リンゴあり、50%で全部ダミー

            let itemsToPlace = [];
            
            if (hasTargetInCurrentRound) {
                // 赤リンゴありパターン（赤1つ ＋ ダミー）
                itemsToPlace.push({ isTarget: true, emoji: '🍎' });
                for (let i = 0; i < numItems - 1; i++) {
                    itemsToPlace.push({ isTarget: false, emoji: getRandomDistractor() });
                }
            } else {
                // 全部ダミーパターン
                for (let i = 0; i < numItems; i++) {
                    itemsToPlace.push({ isTarget: false, emoji: getRandomDistractor() });
                }
            }

            // 描画順をランダムに（赤リンゴが常に最初に出ないように）
            itemsToPlace.sort(() => Math.random() - 0.5);

            // 2. 重なり防止のため、画面を3x3の9マス（グリッド）に見立てる
            const areaRect = playArea.getBoundingClientRect();
            const cellWidth = areaRect.width / 3;
            const cellHeight = areaRect.height / 3;

            // 0〜8のマス目から、アイテムの数だけランダムな位置を選ぶ
            const availableCells = [0, 1, 2, 3, 4, 5, 6, 7, 8].sort(() => Math.random() - 0.5).slice(0, numItems);

            // 3. アイテムの配置
            itemsToPlace.forEach((item, index) => {
                const cellIndex = availableCells[index];
                const col = cellIndex % 3;
                const row = Math.floor(cellIndex / 3);

                const el = document.createElement('div');
                el.className = 'game-target target-anim';
                el.innerHTML = item.emoji;

                // 各マス目の「中心」に配置しつつ、少しだけランダムにズラす（マスからはみ出ない程度）
                const jitterX = (Math.random() - 0.5) * (cellWidth * 0.4);
                const jitterY = (Math.random() - 0.5) * (cellHeight * 0.4);

                const x = (col * cellWidth) + (cellWidth / 2) + jitterX;
                const y = (row * cellHeight) + (cellHeight / 2) + jitterY;

                el.style.left = `${x}px`;
                el.style.top = `${y}px`;

                // クリック（タップ）イベント
                const clickHandler = (e) => {
                    e.preventDefault();
                    handleItemClick(item.isTarget);
                };
                el.addEventListener('mousedown', clickHandler);
                el.addEventListener('touchstart', clickHandler, {passive: false});

                playArea.appendChild(el);
            });

            // 2秒後にタイムアウト判定
            roundTimeout = setTimeout(handleTimeout, TARGET_DURATION);
        }

        // --- クリック・判定ロジック ---
        function handleItemClick(clickedTarget) {
            if (!isPlaying) return;
            clearTimeout(roundTimeout);
            playArea.innerHTML = ''; 

            if (clickedTarget) {
                // 赤りんごをクリックした（大正解）
                addScore();
                showFeedback(true);
            } else {
                // ダミーをクリックしてしまった（不正解）
                showFeedback(false);
            }

            setTimeout(nextRound, 700);
        }

        function handleTimeout() {
            if (!isPlaying) return;
            playArea.innerHTML = ''; 

            if (hasTargetInCurrentRound) {
                // 赤リンゴがあったのに見逃した（不正解）
                showFeedback(false);
            } else {
                // 赤リンゴがないことに気づき、触らずに我慢できた！（大正解）
                addScore();
                showFeedback(true);
            }

            setTimeout(nextRound, 700);
        }

        function addScore() {
            score += POINTS_PER_ROUND;
            updateHeader();
        }

        function showFeedback(isCorrect) {
            feedbackText.textContent = isCorrect ? '⭕️' : '❌';
            feedbackText.className = `text-[15rem] md:text-[20rem] font-black filter drop-shadow-2xl feedback-anim ${isCorrect ? 'text-red-500' : 'text-blue-600'}`;
            feedbackOverlay.classList.remove('hidden');
            
            setTimeout(() => {
                feedbackOverlay.classList.add('hidden');
            }, 600);
        }

        function updateHeader() {
            roundDisplay.textContent = `${Math.min(currentRound, TOTAL_ROUNDS)} / ${TOTAL_ROUNDS}`;
            scoreDisplay.textContent = score;
        }

        function endGame() {
            isPlaying = false;
            stopBGM();
            finalScore.textContent = score;
            
            if (score === 100) {
                resultMessage.textContent = "満点です！パーフェクト！🎉";
                resultMessage.className = "text-3xl md:text-4xl font-bold text-red-600 mt-6";
            } else if (score >= 80) {
                resultMessage.textContent = "素晴らしい判断力です！👏";
                resultMessage.className = "text-3xl md:text-4xl font-bold text-orange-500 mt-6";
            } else if (score >= 50) {
                resultMessage.textContent = "よく頑張りました！✨";
                resultMessage.className = "text-3xl md:text-4xl font-bold text-green-600 mt-6";
            } else {
                resultMessage.textContent = "自分のペースで続けましょう！🌱";
                resultMessage.className = "text-3xl md:text-4xl font-bold text-blue-600 mt-6";
            }
            showScreen('result');
        }

        document.getElementById('start-btn').addEventListener('click', startGame);
        document.getElementById('restart-btn').addEventListener('click', startGame);

    </script>
</body>
</html>
