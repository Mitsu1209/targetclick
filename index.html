<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Go/No-Go 認知機能ゲーム</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0fdf4; /* 目に優しい薄い緑色 */
            touch-action: manipulation; /* ズーム防止 */
            user-select: none; /* テキスト選択防止 */
        }
        
        /* ターゲットがふんわり出現するアニメーション */
        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            80% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .target-anim {
            animation: popIn 0.2s ease-out forwards;
        }

        /* マルバツが迫ってくるアニメーション */
        @keyframes feedbackPop {
            0% { transform: scale(0.5); opacity: 0; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1); opacity: 0; }
        }
        .feedback-anim {
            animation: feedbackPop 0.6s ease-in-out forwards;
        }

        /* ターゲット要素のスタイル */
        .game-target {
            position: absolute;
            font-size: 8rem; /* 約128pxの巨大サイズ */
            cursor: pointer;
            line-height: 1;
            filter: drop-shadow(0 10px 8px rgb(0 0 0 / 0.2));
            transition: transform 0.1s;
        }
        .game-target:active {
            transform: scale(0.9);
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col items-center justify-center text-gray-800">

    <!-- ご指定のBGMファイルを設定しています -->
    <audio id="bgm" src="bgm.mp3" loop></audio>

    <!-- スタート画面 -->
    <div id="start-screen" class="flex flex-col items-center justify-center w-full h-full p-4 text-center">
        <h1 class="text-5xl md:text-7xl font-black text-green-700 mb-8 tracking-wider">
            脳トレ・クリック！
        </h1>
        
        <div class="bg-white p-8 rounded-3xl shadow-2xl border-4 border-green-500 mb-10 max-w-3xl">
            <h2 class="text-3xl font-bold mb-6 text-gray-800 border-b-4 border-green-200 pb-2">【あそびかた】</h2>
            <ul class="text-2xl md:text-4xl font-bold space-y-6 text-left">
                <li class="flex items-center">
                    <span class="text-5xl mr-4">🍎</span> 
                    <span class="text-red-600">赤りんご</span> が出たら <span class="text-red-600 ml-2 border-b-4 border-red-600">素早くクリック！</span>
                </li>
                <li class="flex items-center">
                    <span class="text-5xl mr-4">🍏 💣</span> 
                    青りんごと爆弾は <span class="text-blue-600 ml-2 border-b-4 border-blue-600">さわらず待つ！</span>
                </li>
            </ul>
        </div>

        <button id="start-btn" class="bg-red-500 hover:bg-red-600 text-white font-black text-4xl md:text-5xl py-6 px-16 rounded-full shadow-[0_10px_0_rgb(185,28,28)] active:shadow-[0_0px_0_rgb(185,28,28)] active:translate-y-[10px] transition-all">
            ゲームスタート！
        </button>
    </div>

    <!-- ゲーム画面 -->
    <div id="game-screen" class="hidden flex-col w-full h-full relative">
        <!-- ヘッダー（スコアとラウンド数） -->
        <div class="h-24 bg-green-700 text-white flex justify-between items-center px-8 shadow-md z-10">
            <div class="text-3xl md:text-4xl font-bold">
                回数：<span id="round-display" class="text-yellow-300">1 / 20</span>
            </div>
            <div class="text-3xl md:text-4xl font-bold">
                得点：<span id="score-display" class="text-yellow-300">0</span> 点
            </div>
        </div>

        <!-- プレイエリア（ここにターゲットが出現） -->
        <div id="play-area" class="flex-1 relative bg-white overflow-hidden cursor-crosshair">
            <!-- ターゲット要素はJSで生成してここに追加されます -->
        </div>

        <!-- ⭕️❌フィードバック（画面中央に巨大表示） -->
        <div id="feedback-overlay" class="absolute inset-0 flex items-center justify-center pointer-events-none z-50 hidden">
            <span id="feedback-text" class="text-[15rem] md:text-[20rem] font-black filter drop-shadow-2xl">⭕️</span>
        </div>
    </div>

    <!-- 結果画面 -->
    <div id="result-screen" class="hidden flex-col items-center justify-center w-full h-full p-4 text-center bg-yellow-50">
        <h2 class="text-5xl md:text-6xl font-bold text-gray-700 mb-4">結果発表</h2>
        
        <div class="bg-white p-12 rounded-3xl shadow-2xl border-8 border-yellow-400 mb-10">
            <p class="text-3xl font-bold text-gray-500 mb-2">あなたの得点は...</p>
            <div class="text-[6rem] md:text-[9rem] font-black text-red-600 leading-none">
                <span id="final-score">100</span><span class="text-5xl md:text-7xl text-gray-700">点</span>
            </div>
            <p id="result-message" class="text-3xl md:text-4xl font-bold text-green-700 mt-6">
                素晴らしい集中力です！
            </p>
        </div>

        <button id="restart-btn" class="bg-blue-500 hover:bg-blue-600 text-white font-black text-4xl py-6 px-12 rounded-full shadow-[0_10px_0_rgb(29,78,216)] active:shadow-[0_0px_0_rgb(29,78,216)] active:translate-y-[10px] transition-all">
            もう一度あそぶ
        </button>
    </div>

    <script>
        // ゲームの状態を管理する変数
        const TOTAL_ROUNDS = 20;
        const TARGET_DURATION = 1500; // 1.5秒
        const POINTS_PER_ROUND = 5;

        let currentRound = 0;
        let score = 0;
        let isPlaying = false;
        let roundTimeout;
        let currentTargetType = ''; // 'red-apple', 'green-apple', or 'bomb'

        // DOM要素の取得
        const screens = {
            start: document.getElementById('start-screen'),
            game: document.getElementById('game-screen'),
            result: document.getElementById('result-screen')
        };
        const playArea = document.getElementById('play-area');
        const roundDisplay = document.getElementById('round-display');
        const scoreDisplay = document.getElementById('score-display');
        const feedbackOverlay = document.getElementById('feedback-overlay');
        const feedbackText = document.getElementById('feedback-text');
        const finalScore = document.getElementById('final-score');
        const resultMessage = document.getElementById('result-message');
        const bgm = document.getElementById('bgm');

        // 画面切り替え関数
        function showScreen(screenName) {
            Object.values(screens).forEach(screen => screen.classList.add('hidden'));
            screens[screenName].classList.remove('hidden');
            if(screenName === 'game') screens[screenName].classList.add('flex');
            if(screenName === 'start' || screenName === 'result') screens[screenName].classList.add('flex');
        }

        // BGMの再生・停止制御
        function playBGM() {
            bgm.currentTime = 0;
            bgm.play().catch(e => console.log("BGM自動再生がブラウザにブロックされました:", e));
        }
        function stopBGM() {
            bgm.pause();
        }

        // ゲーム開始処理
        function startGame() {
            currentRound = 0;
            score = 0;
            isPlaying = true;
            updateHeader();
            showScreen('game');
            playBGM();
            
            // 最初のラウンドを開始（少しだけ間を置く）
            setTimeout(nextRound, 1000);
        }

        // 次のラウンドへ進む処理
        function nextRound() {
            if (currentRound >= TOTAL_ROUNDS) {
                endGame();
                return;
            }

            currentRound++;
            updateHeader();
            playArea.innerHTML = ''; // 前のターゲットを消去

            // ターゲットをランダムに決定（50%赤りんご、25%青りんご、25%爆弾）
            const rand = Math.random();
            if (rand < 0.5) {
                currentTargetType = 'red-apple';
            } else if (rand < 0.75) {
                currentTargetType = 'green-apple';
            } else {
                currentTargetType = 'bomb';
            }
            
            // ターゲットのDOM要素を作成
            const targetEl = document.createElement('div');
            targetEl.className = 'game-target target-anim';
            if (currentTargetType === 'red-apple') targetEl.innerHTML = '🍎';
            else if (currentTargetType === 'green-apple') targetEl.innerHTML = '🍏';
            else targetEl.innerHTML = '💣';

            // プレイエリアのサイズを取得し、ターゲットがはみ出さないように配置
            const areaRect = playArea.getBoundingClientRect();
            const targetSize = 130; // 約8rem
            const maxX = areaRect.width - targetSize;
            const maxY = areaRect.height - targetSize;

            // ランダムな位置（余白を考慮）
            const randomX = Math.max(20, Math.floor(Math.random() * maxX) - 20);
            const randomY = Math.max(20, Math.floor(Math.random() * maxY) - 20);

            targetEl.style.left = `${randomX}px`;
            targetEl.style.top = `${randomY}px`;

            // クリックイベントの追加
            targetEl.addEventListener('mousedown', handleTargetClick); // タッチパネル対応のためmousedown
            targetEl.addEventListener('touchstart', handleTargetClick, {passive: false});

            playArea.appendChild(targetEl);

            // 1.5秒経過後の処理（タイムアウト＝何もしなかった場合）
            roundTimeout = setTimeout(handleTimeout, TARGET_DURATION);
        }

        // ターゲットをクリック（タッチ）した時の処理
        function handleTargetClick(e) {
            e.preventDefault();
            if (!isPlaying) return;
            
            clearTimeout(roundTimeout);
            playArea.innerHTML = ''; // すぐにターゲットを消す

            if (currentTargetType === 'red-apple') {
                // 赤りんごをクリック（大正解）
                addScore();
                showFeedback(true);
            } else {
                // 青りんご・爆弾をクリック（不正解）
                showFeedback(false);
            }

            // フィードバックを見せた後、次のラウンドへ
            setTimeout(nextRound, 700);
        }

        // 時間切れ（何もしなかった）時の処理
        function handleTimeout() {
            if (!isPlaying) return;
            playArea.innerHTML = ''; // ターゲットを消す

            if (currentTargetType !== 'red-apple') {
                // 青りんごや爆弾を無視できた（大正解）
                addScore();
                showFeedback(true);
            } else {
                // 赤りんごを見逃した（不正解）
                showFeedback(false);
            }

            setTimeout(nextRound, 700);
        }

        // スコア加算
        function addScore() {
            score += POINTS_PER_ROUND;
            updateHeader();
        }

        // ⭕️❌のフィードバックアニメーション表示
        function showFeedback(isCorrect) {
            feedbackText.textContent = isCorrect ? '⭕️' : '❌';
            feedbackText.className = `text-[15rem] md:text-[20rem] font-black filter drop-shadow-2xl feedback-anim ${isCorrect ? 'text-red-500' : 'text-blue-600'}`;
            
            feedbackOverlay.classList.remove('hidden');
            
            // アニメーションが終わる頃に隠す
            setTimeout(() => {
                feedbackOverlay.classList.add('hidden');
            }, 600);
        }

        // ヘッダーの表示更新
        function updateHeader() {
            roundDisplay.textContent = `${Math.min(currentRound, TOTAL_ROUNDS)} / ${TOTAL_ROUNDS}`;
            scoreDisplay.textContent = score;
        }

        // ゲーム終了時の処理
        function endGame() {
            isPlaying = false;
            stopBGM();
            
            finalScore.textContent = score;
            
            // 点数に応じたメッセージ
            if (score === 100) {
                resultMessage.textContent = "満点です！パーフェクト！🎉";
                resultMessage.className = "text-3xl md:text-4xl font-bold text-red-600 mt-6";
            } else if (score >= 80) {
                resultMessage.textContent = "素晴らしい反射神経です！👏";
                resultMessage.className = "text-3xl md:text-4xl font-bold text-orange-500 mt-6";
            } else if (score >= 50) {
                resultMessage.textContent = "よく頑張りました！✨";
                resultMessage.className = "text-3xl md:text-4xl font-bold text-green-600 mt-6";
            } else {
                resultMessage.textContent = "自分のペースで続けましょう！🌱";
                resultMessage.className = "text-3xl md:text-4xl font-bold text-blue-600 mt-6";
            }

            showScreen('result');
        }

        // ボタンのイベントリスナー登録
        document.getElementById('start-btn').addEventListener('click', startGame);
        document.getElementById('restart-btn').addEventListener('click', startGame);

    </script>
</body>
</html>
